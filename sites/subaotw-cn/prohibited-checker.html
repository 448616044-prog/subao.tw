<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>大陆寄台湾禁运品查询器 | 能寄不能寄一键查 2026 | 速豹集运</title>
<meta name="description" content="大陆寄台湾禁运品查询器：输入物品名称，一键查询是否能寄送到台湾。覆盖家具/设备/建材/食品/电子产品等50+品类。速豹集运专业大件物流，双清包税门到门。">
<meta name="keywords" content="寄台湾禁运品查询,大陆寄台湾能寄吗,台湾海关禁运,大件物流台湾清关,设备出口台湾海关">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="canonical" href="https://www.subaotw.cn/prohibited-checker">
<link rel="stylesheet" href="style.css">
<style>
.tool-box{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow-md);padding:32px;margin:32px 0}
.tool-title{font-size:24px;font-weight:700;margin-bottom:16px}
.search-box{display:flex;gap:12px;margin-bottom:20px}
.search-box input{flex:1;padding:14px 18px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:16px;background:var(--bg)}
.search-box input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(26,86,219,.1)}
.search-box button{padding:14px 32px;background:var(--primary);color:#fff;border:none;border-radius:var(--radius-sm);font-size:16px;font-weight:700;cursor:pointer}
.result-card{padding:20px;border-radius:var(--radius-sm);margin-top:16px;display:none}
.result-card.show{display:block}
.result-ok{background:var(--green-light);border:1px solid #a7f3d0}
.result-no{background:#fef2f2;border:1px solid #fecaca}
.result-warn{background:var(--accent-light);border:1px solid #fed7aa}
.result-icon{font-size:32px;margin-bottom:8px}
.result-text{font-size:18px;font-weight:700;margin-bottom:8px}
.result-detail{font-size:14px;color:var(--text-muted);line-height:1.6}
.quick-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.quick-tag{padding:8px 16px;background:var(--bg);border:1px solid var(--border);border-radius:20px;font-size:13px;cursor:pointer;transition:all .2s}
.quick-tag:hover{background:var(--primary-light);color:var(--primary);border-color:var(--primary)}
</style>
</head>
<body>
<header class="header"><div class="container"><a href="/" class="logo">速豹集运<span>大陆→台湾专线</span></a>
<nav class="nav"><a href="/">首页</a><a href="/city/">城市专线</a><a href="/equipment/">设备出口</a><a href="/guide/">物流攻略</a><a href="/cases/">运输案例</a><a href="/prohibited-checker" class="active">禁运查询</a></nav></div></header>

<section class="page-hero"><div class="container">
<h1>大陆寄台湾禁运品查询器</h1>
<p>不确定能不能寄？输入物品名称，一键查询清关政策。覆盖家具/设备/建材/食品等全品类</p>
</div></section>

<section class="section"><div class="container">
<div class="tool-box">
<div class="tool-title">🔍 输入物品名称查询</div>
<div class="search-box">
<input type="text" id="itemInput" placeholder="例如：沙发、数控机床、瓷砖、木地板、农药..." onkeyup="if(event.key==='Enter')check()">
<button onclick="check()">查询</button>
</div>
<div class="result-card" id="result">
<div class="result-icon" id="resultIcon"></div>
<div class="result-text" id="resultText"></div>
<div class="result-detail" id="resultDetail"></div>
</div>
<div class="quick-tags">
<strong style="font-size:13px;color:var(--text-muted);margin-right:8px">热门查询：</strong>
<span class="quick-tag" onclick="quickCheck('沙发')">沙发</span>
<span class="quick-tag" onclick="quickCheck('数控机床')">数控机床</span>
<span class="quick-tag" onclick="quickCheck('瓷砖')">瓷砖</span>
<span class="quick-tag" onclick="quickCheck('农药')">农药</span>
<span class="quick-tag" onclick="quickCheck('电池')">电池</span>
<span class="quick-tag" onclick="quickCheck('食品')">食品</span>
<span class="quick-tag" onclick="quickCheck('化妆品')">化妆品</span>
<span class="quick-tag" onclick="quickCheck('二手衣物')">二手衣物</span>
</div>
</div>
</div></section>

<script>
const rules = [
  {kw:['沙发','床','桌椅','柜子','衣柜','家具'],ok:true,text:'✅ 可以寄',detail:'家具属于普货，可走海运专线。需用木箱或纸箱包装。¥8-12/kg，7-12天门到门。'},
  {kw:['数控机床','CNC','注塑机','冲床','加工中心','机床','设备','机械'],ok:true,text:'✅ 可以寄（需报关）',detail:'设备出口台湾需提供报关资料（装箱单/发票/合同）。速豹提供一站式报关+运输+派送服务。¥10-15/kg，10-15天。'},
  {kw:['瓷砖','石材','卫浴','建材','管材','地板','木材'],ok:true,text:'✅ 可以寄',detail:'建材属于普货，需打木架防碎。海运专线¥8-10/kg，大批量可整柜运输。'},
  {kw:['农药','化肥','化学','危险品'],ok:false,text:'❌ 不能寄',detail:'农药/化肥/危险化学品属于禁运品，任何物流公司均不能承运。违反会被海关查扣并处罚。'},
  {kw:['电池','锂电池','充电宝'],ok:'warn',text:'⚠️ 需特殊申报',detail:'含锂电池设备需走危险品专线，提供MSDS报告和UN38.3认证。普通干电池可随普货寄送。'},
  {kw:['食品','零食','茶叶','保健品'],ok:'warn',text:'⚠️ 台湾海关有食品管制',detail:'台湾对大陆食品进口有严格检疫要求。部分加工食品可寄，但需提供成分表和卫生证明。散装/自制食品不可寄。'},
  {kw:['化妆品','护肤品','面膜'],ok:'warn',text:'⚠️ 需成分审查',detail:'含酒精/美白成分的化妆品可能被扣。建议提供完整成分表和MSDS。'},
  {kw:['二手衣物','旧物品','废品'],ok:false,text:'❌ 不能寄',detail:'台湾禁止进口旧衣物和废品。个人搬家衣物需清洗干净并提供搬家证明。'},
  {kw:['书籍','文具','玩具','日用品'],ok:true,text:'✅ 可以寄',detail:'普货，正常寄送即可。海运¥8/kg起，7-12天门到门。'},
];
function findRule(q){q=q.toLowerCase();for(let r of rules){for(let k of r.kw){if(q.includes(k))return r}}return null}
function check(){const q=document.getElementById('itemInput').value;if(!q)return;showResult(q)}
function quickCheck(q){document.getElementById('itemInput').value=q;showResult(q)}
function showResult(q){
  const r=findRule(q);
  const el=document.getElementById('result');
  if(r){
    el.className='result-card show result-'+(r.ok===true?'ok':r.ok===false?'no':'warn');
    document.getElementById('resultIcon').textContent=r.ok===true?'✅':r.ok===false?'❌':'⚠️';
    document.getElementById('resultText').textContent=r.text;
    document.getElementById('resultDetail').textContent=r.detail;
  } else {
    el.className='result-card show result-warn';
    document.getElementById('resultIcon').textContent='🤔';
    document.getElementById('resultText').textContent='未找到匹配规则';
    document.getElementById('resultDetail').textContent='建议直接联系速豹客服，告知具体物品名称和数量，我们帮你确认能否寄送。';
  }
}
</script>
</body></html>
