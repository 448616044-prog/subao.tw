*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans TC',-apple-system,sans-serif;background:#f5f7fa;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.calc{background:#fff;border-radius:16px;padding:32px;max-width:480px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,.12);position:relative}
.calc h1{font-size:22px;font-weight:700;color:#1a1a2e;margin-bottom:4px;text-align:center}
.calc .sub{font-size:13px;color:#999;text-align:center;margin-bottom:24px}
.field{margin-bottom:16px}
.field label{display:block;font-size:14px;font-weight:600;color:#333;margin-bottom:6px}
.field select,.field input{width:100%;padding:12px;border:2px solid #e2e8f0;border-radius:8px;font-size:15px;font-family:inherit;outline:none;transition:border .2s;background:#fff}
.field select:focus,.field input:focus{border-color:#0066CC}
.service-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.service-tab{padding:12px 8px;border:2px solid #e2e8f0;border-radius:10px;background:#f8fafc;cursor:pointer;font-size:13px;color:#475569;transition:all .2s;text-align:center;line-height:1.4;font-weight:600}
.service-tab small{display:block;font-size:11px;color:#94a3b8;font-weight:400;margin-top:2px}
.service-tab.active{border-color:#0066CC;background:#E6F0FA;color:#004C99}
.service-tab.active small{color:#0066CC}
.result{background:linear-gradient(135deg,#0066CC,#004C99);color:#fff;padding:20px;border-radius:12px;text-align:center;margin:20px 0;display:none}
.result.show{display:block}
.result .price{font-size:36px;font-weight:800}
.result .detail{font-size:13px;opacity:.85;margin-top:6px;line-height:1.6}
.btn{width:100%;padding:14px;background:linear-gradient(135deg,#E65100,#E65100);color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;transition:.2s}
.btn:hover{transform:translateY(-1px)}
.cta{text-align:center;margin-top:16px;font-size:14px;color:#666}
.cta a{color:#008A00;font-weight:700;text-decoration:none}


</style></head><body>
<div class="calc">
  <h1>📦 台灣寄大陸運費快算</h1>
  <p class="sub">按官方價格表自動計算，5秒估價</p>

  <div class="field">
    <label>重量 (kg)</label>
    <input type="number" id="weight" min="0.1" max="100" step="0.1" placeholder="例如：3">
  </div>

  <div class="field">
    <label>服務類型</label>
    <div class="service-tabs">
      <button type="button" class="service-tab active" data-service="economy" onclick="setService('economy', this)">🚢 經濟專線<small>海運約兩週到貨</small></button>
      <button type="button" class="service-tab" data-service="express" onclick="setService('express', this)">✈️ 快件專線<small>空運約一週到貨</small></button>
    </div>
  </div>

  <div class="field">
    <label>商品類型</label>
    <select id="type">
      <option value="A">A類 - 奶粉/舊衣服/日用雜物/食品</option>
      <option value="B">B類 - 美妝/保健品/保養品/貼布</option>
      <option value="C">C類 - 電器類（含電池）</option>
      <option value="D">D類 - 中西藥</option>
    </select>
  </div>

  <div class="field">
    <label>目的區域</label>
    <select id="region">
      <option value="huaNan">華南地區（福建、廣東）</option>
      <option value="huaDong">華東地區（浙江、上海、江蘇）</option>
      <option value="huaZhong">華中地區（江西、湖南、湖北、安徽）</option>
      <option value="huaBei">華北地區（山東、山西、京津冀、河南）</option>
      <option value="xiNan">西南地區（四川、重慶、貴州、雲南、廣西、海南）</option>
      <option value="dongBei">東北地區（陝西、遼寧、黑龍江、吉林）</option>
      <option value="xiBei">西北地區（甘肅、青海、寧夏、內蒙古、西藏、新疆）</option>
    </select>
  </div>

  <button class="btn" onclick="calculate()">計算運費</button>

  <div class="result" id="result">
    <div class="price" id="price">NT$0</div>
    <div class="detail" id="detail"></div>
  </div>

  <div class="cta">
    精確報價？加入 <a href="https://line.me/R/ti/p/@734dooky" target="_blank">LINE 免費估價</a>
  </div>
</div>

<script>
// === 官方價格表（與 https://subao.tw/pricing 完全一致） ===
// 結構：價格表[服務類型][區域][類別] = NT$/kg
const PRICE_TABLE = {
  economy: { // 🚢 經濟專線 - 海運約兩週到貨
    huaNan:   {A: 290,  B: 360, C: 500,  D: 780},
    huaDong:  {A: 290,  B: 360, C: 500,  D: 780},
    huaZhong: {A: 300,  B: 380, C: 530,  D: 780},
    huaBei:   {A: 320,  B: 390, C: 530,  D: 780},
    xiNan:    {A: 330,  B: 410, C: 540,  D: 780},
    dongBei:  {A: 350,  B: 420, C: 560,  D: 1080},
    xiBei:    {A: 360,  B: 440, C: 570,  D: 1080}
  },
  express: { // ✈️ 快件專線 - 空運約一週到貨
    huaNan:   {A: 380,  B: 450, C: 590,  D: 870},
    huaDong:  {A: 380,  B: 450, C: 590,  D: 870},
    huaZhong: {A: 390,  B: 470, C: 600,  D: 870},
    huaBei:   {A: 410,  B: 480, C: 620,  D: 870},
    xiNan:    {A: 420,  B: 500, C: 630,  D: 870},
    dongBei:  {A: 440,  B: 510, C: 650,  D: 1170},
    xiBei:    {A: 450,  B: 530, C: 660,  D: 1170}
  }
};

const REGION_NAMES = {
  huaNan:'華南', huaDong:'華東', huaZhong:'華中', huaBei:'華北',
  xiNan:'西南', dongBei:'東北', xiBei:'西北'
};
const TYPE_NAMES = {A:'A類', B:'B類', C:'C類', D:'D類'};
const SERVICE_INFO = {
  economy: {name:'經濟專線（海運）', eta:'約兩週到貨'},
  express: {name:'快件專線（空運）', eta:'約一週到貨'}
};

let currentService = 'economy';

function setService(svc, el){
  currentService = svc;
  document.querySelectorAll('.service-tab').forEach(function(b){b.classList.remove('active')});
  if(el) el.classList.add('active');
}

function calculate(){
  var w=parseFloat(document.getElementById('weight').value)||0;
  var t=document.getElementById('type').value;
  var r=document.getElementById('region').value;
  if(w<=0||w>100){alert('請輸入有效重量（0.1-100kg）');return}

  // 重量向上取整，最少 1kg（標準集運計費規則）
  var totalKg = Math.max(1, Math.ceil(w));
  var unitPrice = PRICE_TABLE[currentService][r][t];
  var baseCost = totalKg * unitPrice;
  // 派送費：不足 10kg 加收 NT$100，滿 10kg 免收（與官方計費規則一致）
  var surcharge = w < 10 ? 100 : 0;
  var totalPrice = baseCost + surcharge;

  document.getElementById('price').textContent = 'NT$ ' + totalPrice.toLocaleString();
  document.getElementById('detail').innerHTML =
    SERVICE_INFO[currentService].name + ' | 約 ' + w + 'kg，向上取整 ' + totalKg + 'kg × NT$' + unitPrice.toLocaleString() + '/kg' +
    (surcharge > 0 ? ' + NT$100 派送費（不足10kg）' : '（滿10kg免派送費）') + '<br>' +
    '目的地：' + REGION_NAMES[r] + ' | 商品：' + TYPE_NAMES[t] + ' | ' + SERVICE_INFO[currentService].eta;
  document.getElementById('result').classList.add('show');
}

['weight'].forEach(function(id){
  var el=document.getElementById(id);
  if(el){el.addEventListener('input', function(){if(this.value>0&&this.value<=100) calculate()});}
});
document.getElementById('type').addEventListener('change', calculate);
document.getElementById('region').addEventListener('change', calculate);
</script>
</body></html>
